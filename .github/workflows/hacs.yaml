name: HACS
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - develop
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # hacs/action only wraps the mutable ghcr.io/hacs/action:main image,
      # so the image is used directly and pinned by digest.
      - uses: docker://ghcr.io/hacs/action@sha256:187499a09c5d41f9f0d42ff80d203ed87b974c028290140913b61e005fb0aab2  # main
        env:
          CATEGORY: integration
          INPUT_GITHUB_TOKEN: ${{ github.token }}
