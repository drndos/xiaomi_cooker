name: Hassfest

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - develop
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      # home-assistant/actions/hassfest only wraps the mutable
      # ghcr.io/home-assistant/hassfest:latest image, so the image is used
      # directly and pinned by digest.
      - uses: docker://ghcr.io/home-assistant/hassfest@sha256:a6a695921327230c07ba89ebbb48778737bc1dda30b00cb60c9276585687fc6d  # latest
